name: Test

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.23.4', '24.22.1', '26.12.1']

    steps:
      - uses: actions/checkout@v4

      - name: Checkout WebSocket security integration
        uses: actions/checkout@v4
        with:
          repository: chuzouX/phira-mp-nodejsver-websocket
          ref: 3cf295e7004fd46352c1b4d608d359147d188942
          path: plugins/websocket

      - name: Checkout dashboard security integration
        uses: actions/checkout@v4
        with:
          repository: chuzouX/phira-mp-nodejsver-web-dashboard
          ref: 0348d3954fccb50a8fa1db42049e2df52c438f4e
          path: plugins/web-dashboard

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: cp .env.example .env

      - run: npm run build

      - name: Test host and plugin integrations
        run: npm test -- --runInBand
