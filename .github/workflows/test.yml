name: Test

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.23.4', '24.22.1', '26.12.1']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: cp .env.example .env

      - run: npm run build

      # Dashboard suites require separately installed plugin repositories.
      - name: Test host source release
        run: npm test -- --runInBand --testPathIgnorePatterns web-dashboard
